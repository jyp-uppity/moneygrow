    function calculateResult(answers) {
      let scores = { pTraitRaw: 0, pActionRaw: 0, rTraitRaw: 0, rActionRaw: 0, impRaw: 0, avdRaw: 0 };
      QUESTIONS.forEach(q => {
        const val = answers[q.id] || 3;
        const fVal = q.isReverse ? (6 - val) : val;
        if (q.axis === 'planning') {
          if (q.subType === 'trait') scores.pTraitRaw += fVal;
          else scores.pActionRaw += fVal;
        } else if (q.axis === 'risk') {
          if (q.subType === 'trait') scores.rTraitRaw += fVal;
          else scores.rActionRaw += fVal;
        } else if (q.axis === 'impulsivity') scores.impRaw += fVal;
        else if (q.axis === 'avoidance') scores.avdRaw += fVal;
      });

      const pTrait = Math.round(((scores.pTraitRaw - 4) / 16) * 100);
      const pAction = Math.round(((scores.pActionRaw - 3) / 12) * 100);
      const rTrait = Math.round(((scores.rTraitRaw - 4) / 16) * 100);
      const rAction = Math.round(((scores.rActionRaw - 3) / 12) * 100);
      const impulsivity = Math.round(((scores.impRaw - 3) / 12) * 100);
      const avoidance = Math.round(((scores.avdRaw - 3) / 12) * 100);

      const typeKey = `${pTrait >= 50 ? 'P' : 'S'}${rTrait >= 50 ? 'G' : 'A'}`;
      const typeInfo = TYPES[typeKey];
      const gap = Math.max(Math.abs(pTrait - pAction), Math.abs(rTrait - rAction));

      return {
        typeInfo,
        typeKey,
        scores: { pTrait, pAction, rTrait, rAction, impulsivity, avoidance },
        gap,
        gapText: gap >= 30 ? '크게 불일치 (경고)' : gap >= 15 ? '약간 불일치' : '상태 일치'
      };
    }

                    <div style={{ background: 'rgba(38,68,58,0.05)', padding: '20px', borderRadius: '12px', border: '1px solid var(--line)' }}>
                      <h4 style={{ color: 'var(--bottle)', fontSize: '16px', marginBottom: '12px' }}>강점 Top 3</h4>
                      <ul style={{ paddingLeft: '18px', margin: 0, fontSize: '14px' }}>
                        {result.typeInfo.strengths.map((s, i) => <li key={i} style={{ marginBottom: '6px' }}>{s}</li>)}
                      </ul>
                    </div>
                    <div style={{ background: 'rgba(163,74,52,0.05)', padding: '20px', borderRadius: '12px', border: '1px solid var(--line)' }}>
                      <h4 style={{ color: 'var(--rust)', fontSize: '16px', marginBottom: '12px' }}>주의할 점 Top 3</h4>
                      <ul style={{ paddingLeft: '18px', margin: 0, fontSize: '14px' }}>
                        {result.typeInfo.pitfalls.map((p, i) => <li key={i} style={{ marginBottom: '6px' }}>{p}</li>)}
                      </ul>
                    </div>
                  </div>

                  {/* First Action Plan */}
                  <div className="quote-block">
                    <div style={{ fontSize: '12px', fontWeight: 700, color: 'var(--gold)', textTransform: 'uppercase', marginBottom: '4px' }}>
                      첫 번째 액션 플랜
                    </div>
                    <p style={{ fontSize: '17px' }}>{result.typeInfo.firstAction}</p>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: BOOKING (2단계 재무상담) */}
            {tab === 'booking' && (
              <div className="mg-card" style={{ maxWidth: '780px', margin: '0 auto' }}>
                <div style={{ textAlign: 'center', marginBottom: '28px' }}>
                  <span className="badge badge-gold" style={{ marginBottom: '8px' }}>2단계 · 방향 설정</span>
                  <h2 className="font-serif" style={{ fontSize: '28px', margin: '8px 0' }}>1:1 성향 맞춤 전문 재무상담</h2>
                  <p style={{ fontSize: '14px', color: 'var(--muted)' }}>
                    금융상품 영업 0% · 100% Fee 기반의 중립적인 50분 1:1 맞춤 화상 솔루션
                  </p>
                </div>

                {/* Stepper Header */}
                <div style={{ display: 'flex', borderBottom: '1px solid var(--line)', marginBottom: '32px' }}>
                  <div 
                    onClick={() => setBookingStep(1)}
                    style={{ flex: 1, padding: '14px', textAlign: 'center', fontWeight: 700, fontSize: '15px', borderBottom: bookingStep === 1 ? '3px solid var(--bottle)' : 'none', color: bookingStep === 1 ? 'var(--bottle)' : 'var(--muted)', cursor: 'pointer' }}
                  >
                    1. 사전 고민 작성
                  </div>
                  <div 
                    onClick={() => setBookingStep(2)}
                    style={{ flex: 1, padding: '14px', textAlign: 'center', fontWeight: 700, fontSize: '15px', borderBottom: bookingStep === 2 ? '3px solid var(--bottle)' : 'none', color: bookingStep === 2 ? 'var(--bottle)' : 'var(--muted)', cursor: 'pointer' }}
                  >
                    2. 코치 및 일정 선택
                  </div>
                </div>

                {/* STEP 1: PRE-QUESTIONS */}
                {bookingStep === 1 && (
                  <div>
                    <h3 style={{ fontSize: '18px', marginBottom: '8px' }}>상담 사전 문답 작성</h3>
                    <p style={{ fontSize: '13px', color: 'var(--muted)', marginBottom: '24px' }}>
                      상담사가 사전에 고객님의 현황을 정확히 파악하고 맞춤형 피드백을 준비하기 위한 4가지 주관식 질문입니다.
                    </p>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '20px', marginBottom: '32px' }}>
                      <div>
                        <label style={{ display: 'block', fontWeight: 700, fontSize: '14px', marginBottom: '6px' }}>
                          Q1. 지금 가장 해결하고 싶은 돈 고민은 무엇인가요?
                        </label>
                        <textarea 
                          rows={3}
                          value={bookingData.q1}
                          onChange={(e) => setBookingData({ ...bookingData, q1: e.target.value })}
                          style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '1px solid var(--line)', background: '#fff' }}
                        />
                      </div>
                      <div>
                        <label style={{ display: 'block', fontWeight: 700, fontSize: '14px', marginBottom: '6px' }}>
                          Q2. 최근 1년 동안 돈 문제로 가장 불안했던 순간은 언제인가요?
                        </label>
                        <textarea 
                          rows={3}
                          value={bookingData.q2}
                          onChange={(e) => setBookingData({ ...bookingData, q2: e.target.value })}
                          style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '1px solid var(--line)', background: '#fff' }}
                        />
                      </div>
                      <div>
                        <label style={{ display: 'block', fontWeight: 700, fontSize: '14px', marginBottom: '6px' }}>
                          Q3. 1~3년 안에 이루고 싶은 목표가 있나요? (예: 내집마련 보증금, 이직 자금 등)
                        </label>
                        <textarea 
                          rows={3}
                          value={bookingData.q3}
                          onChange={(e) => setBookingData({ ...bookingData, q3: e.target.value })}
                          style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '1px solid var(--line)', background: '#fff' }}
                        />
                      </div>
                      <div>
                        <label style={{ display: 'block', fontWeight: 700, fontSize: '14px', marginBottom: '6px' }}>
                          Q4. 현재 잘하고 있다고 생각하는 습관과 이번 상담에서 꼭 알고 싶은 것은?
                        </label>
                        <textarea 
                          rows={3}
                          value={bookingData.q4}
                          onChange={(e) => setBookingData({ ...bookingData, q4: e.target.value })}
                          style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '1px solid var(--line)', background: '#fff' }}
                        />
                      </div>
                    </div>

                    <div style={{ textAlign: 'right' }}>
                      <button className="btn-primary" onClick={() => setBookingStep(2)}>
                        코치 및 일정 선택하기 →
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 2: COACH & TIME SELECTION */}
                {bookingStep === 2 && (
                  <div>
                    <h3 style={{ fontSize: '18px', marginBottom: '16px' }}>담당 코치 선택</h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '14px', marginBottom: '28px' }}>
                      {COACHES.map(c => (
                        <div 
                          key={c.id} 
                          onClick={() => setBookingData({ ...bookingData, coachId: c.id })}
                          style={{
                            padding: '18px',
                            borderRadius: '12px',
                            border: bookingData.coachId === c.id ? '2px solid var(--bottle)' : '1px solid var(--line)',
                            background: bookingData.coachId === c.id ? 'rgba(38,68,58,0.05)' : '#fff',
                            cursor: 'pointer'
                          }}
                        >
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div style={{ fontWeight: 700, fontSize: '16px', color: 'var(--ink)' }}>{c.name}</div>
                            <span className="badge badge-gold">{c.title}</span>
                          </div>
                          <div style={{ fontSize: '13px', color: 'var(--muted)', marginTop: '6px' }}>{c.specialty}</div>
                        </div>
                      ))}
                    </div>

                    <h3 style={{ fontSize: '18px', marginBottom: '12px' }}>상담 일시 선택</h3>
                    <select 
                      value={bookingData.timeSlot}
                      onChange={(e) => setBookingData({ ...bookingData, timeSlot: e.target.value })}
                      style={{ width: '100%', padding: '14px', borderRadius: '10px', border: '1px solid var(--line)', background: '#fff', marginBottom: '28px' }}
                    >
                      <option>2026년 8월 5일(월) 19:00</option>
                      <option>2026년 8월 5일(월) 20:00</option>
                      <option>2026년 8월 6일(화) 19:30</option>
                      <option>2026년 8월 7일(수) 21:00</option>
                    </select>

                    <button 
                      className="btn-gold" 
                      style={{ width: '100%', justifyContent: 'center', padding: '16px' }}
                      onClick={() => setBookingConfirmed(true)}
                    >
                      119,000원 결제 및 예약 확정
                    </button>

                    {bookingConfirmed && (
                      <div style={{ marginTop: '24px', background: 'rgba(38,68,58,0.1)', padding: '20px', borderRadius: '12px', color: 'var(--bottle)' }}>
                        <div style={{ fontWeight: 700, fontSize: '16px', marginBottom: '6px' }}>✓ 1:1 상담 예약 및 결제가 성공적으로 완료되었습니다!</div>
                        <div style={{ fontSize: '14px' }}>예약 일시: {bookingData.timeSlot}</div>
                        <div style={{ fontSize: '14px', marginTop: '4px' }}>
                          발급된 Zoom 화상 미팅 링크: <a href="#" onClick={(e) => e.preventDefault()} style={{ textDecoration: 'underline', fontWeight: 700 }}>https://us06web.zoom.us/j/89230198421</a>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* TAB 5: ROUTINE (3단계 루틴관리 대시보드) */}
            {tab === 'routine' && (
              <div>
                {/* DASHBOARD HEADER CARD */}
                <div style={{ background: 'var(--bottle-deep)', color: '#EDEFE4', padding: '36px', borderRadius: '20px', marginBottom: '32px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '16px', marginBottom: '24px' }}>
                    <div>
                      <span className="badge badge-gold" style={{ marginBottom: '10px' }}>3단계 · 행동 지속 | 월 29,800원 구독 이용 중</span>
                      <h1 className="font-serif" style={{ fontSize: '32px', margin: '6px 0 8px', color: '#F6F7EF' }}>
                        김나영님의 재무루틴 관리실
                      </h1>
                      <div style={{ fontSize: '14px', color: 'rgba(237,239,228,0.75)' }}>
                        담당 코치: 이지은 CFP · 목표: 비상금 1,000만 원 및 지출 자동화 시스템
                      </div>
                    </div>

                    <div style={{ display: 'flex', gap: '14px' }}>
                      <div style={{ background: 'rgba(255,255,255,0.08)', padding: '16px 20px', borderRadius: '14px', textAlign: 'center', minWidth: '130px' }}>
                        <div style={{ fontSize: '11px', textTransform: 'uppercase', color: 'rgba(237,239,228,0.6)' }}>연속 실천 (STREAK)</div>
                        <div style={{ fontSize: '24px', fontWeight: 700, color: 'var(--gold-soft)', fontFamily: 'Fraunces, serif' }}>🔥 16일째</div>
                      </div>
                      <div style={{ background: 'rgba(255,255,255,0.08)', padding: '16px 20px', borderRadius: '14px', textAlign: 'center', minWidth: '130px' }}>
                        <div style={{ fontSize: '11px', textTransform: 'uppercase', color: 'rgba(237,239,228,0.6)' }}>주간 미션 달성률</div>
                        <div style={{ fontSize: '24px', fontWeight: 700, color: '#fff', fontFamily: 'Fraunces, serif' }}>{progressPercent}%</div>
                      </div>
                    </div>
                  </div>

                  {/* Progress Bar */}
                  <div style={{ height: '8px', background: 'rgba(255,255,255,0.15)', borderRadius: '4px', overflow: 'hidden' }}>
                    <div style={{ width: `${progressPercent}%`, height: '100%', background: 'linear-gradient(90deg, var(--gold-soft), var(--gold))', transition: 'width 0.3s' }}></div>
                  </div>
                </div>

                {/* SUB TABS */}
                <div style={{ display: 'flex', gap: '12px', borderBottom: '1px solid var(--line)', paddingBottom: '12px', marginBottom: '28px' }}>
                  <button 
                    className={`btn-outline ${routineTab === 'missions' ? 'btn-primary' : ''}`}
                    onClick={() => setRoutineTab('missions')}
                  >
                    📝 주간 실천 미션 ({completedMissionsCount}/{routines.length})
                  </button>
                  <button 
                    className={`btn-outline ${routineTab === 'qna' ? 'btn-primary' : ''}`}
                    onClick={() => setRoutineTab('qna')}
                  >
                    💬 코치 1:1 Q&A ({qnaList.length})
                  </button>
                  <button 
                    className={`btn-outline ${routineTab === 'articles' ? 'btn-primary' : ''}`}
                    onClick={() => setRoutineTab('articles')}
                  >
                    📖 어피티 픽 프리미엄 아티클
                  </button>
                </div>

                {/* SUB TAB 1: MISSIONS */}
                {routineTab === 'missions' && (
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                      <h2 className="font-serif" style={{ fontSize: '22px' }}>이번 주 맞춤 실천 미션</h2>
                      <span style={{ fontSize: '13px', color: 'var(--muted)' }}>클릭하여 완료 상태를 변경하세요</span>
                    </div>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                      {routines.map(r => (
                        <div 
                          key={r.id} 
                          className="mg-card" 
                          style={{
                            padding: '20px 24px',
                            display: 'flex',
                            justifyContent: 'space-between',
                            alignItems: 'center',
                            borderLeft: r.completed ? '5px solid var(--bottle)' : '1px solid var(--line)',
                            background: r.completed ? 'rgba(38,68,58,0.02)' : '#fff'
                          }}
                        >
                          <div style={{ display: 'flex', gap: '16px', alignItems: 'flex-start' }}>
                            <input 
                              type="checkbox" 
                              checked={r.completed} 
                              onChange={() => setRoutines(routines.map(item => item.id === r.id ? { ...item, completed: !item.completed } : item))}
                              style={{ width: '20px', height: '20px', marginTop: '4px', cursor: 'pointer' }}
                            />
                            <div>
                              <div style={{ display: 'flex', gap: '8px', alignItems: 'center', marginBottom: '4px' }}>
                                <span className="badge badge-gold">{r.category}</span>
                                <span style={{ fontSize: '12px', color: 'var(--muted)' }}>{r.day}</span>
                              </div>
                              <div style={{ fontWeight: 700, fontSize: '17px', color: 'var(--ink)', textDecoration: r.completed ? 'line-through' : 'none' }}>
                                {r.title}
                              </div>
                              <div style={{ fontSize: '13px', color: 'var(--muted)', marginTop: '4px' }}>{r.desc}</div>
                            </div>
                          </div>

                          <button 
                            className={r.completed ? 'btn-primary' : 'btn-outline'}
                            style={{ padding: '8px 18px', fontSize: '13px', whiteSpace: 'nowrap' }}
                            onClick={() => setRoutines(routines.map(item => item.id === r.id ? { ...item, completed: !item.completed } : item))}
                          >
                            {r.completed ? '✓ 수행 완료' : '진행 중'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* SUB TAB 2: COACH Q&A */}
                {routineTab === 'qna' && (
                  <div>
                    <div className="mg-card" style={{ marginBottom: '28px' }}>
                      <h3 style={{ fontSize: '18px', marginBottom: '12px' }}>담당 코치(이지은 CFP)에게 질문하기</h3>
                      <p style={{ fontSize: '13px', color: 'var(--muted)', marginBottom: '16px' }}>
                        주 1회 질문이 가능하며, 48시간 이내에 1:1 모의 피드백 답변이 도착합니다.
                      </p>
                      <textarea 
                        rows={3} 
                        placeholder="이번 주 미션을 수행하면서 어려웠던 점이나 금융 질문을 남겨주세요."
                        value={userQuestion}
                        onChange={(e) => setUserQuestion(e.target.value)}
                        style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '1px solid var(--line)', marginBottom: '14px' }}
                      />
                      <button 
                        className="btn-primary"
                        onClick={() => {
                          if (!userQuestion.trim()) return;
                          setQnaList([...qnaList, {
                            id: Date.now(),
                            date: new Date().toISOString().split('T')[0],
                            q: userQuestion,
                            a: '답변을 작성하고 있습니다. 약 24~48시간 이내 피드백이 업데이트됩니다.',
                            coach: '이지은 CFP'
                          }]);
                          setUserQuestion('');
                        }}
                      >
                        질문 제출하기
                      </button>
                    </div>

                    <h3 style={{ fontSize: '18px', marginBottom: '16px' }}>Q&A 답변 내역</h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                      {qnaList.map(item => (
                        <div key={item.id} className="mg-card">
                          <div style={{ fontSize: '12px', color: 'var(--muted)', marginBottom: '6px' }}>질문일: {item.date}</div>
                          <div style={{ fontWeight: 700, fontSize: '16px', color: 'var(--ink)', marginBottom: '12px' }}>Q. {item.q}</div>
                          <div style={{ background: 'var(--paper)', padding: '16px', borderRadius: '10px', borderLeft: '3px solid var(--bottle)' }}>
                            <div style={{ fontWeight: 700, fontSize: '13px', color: 'var(--bottle)', marginBottom: '4px' }}>💬 {item.coach} 답변</div>
                            <div style={{ fontSize: '14px', color: 'var(--body)' }}>{item.a}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* SUB TAB 3: ARTICLES */}
                {routineTab === 'articles' && (
                  <div>
                    <h2 className="font-serif" style={{ fontSize: '22px', marginBottom: '20px' }}>어피티 픽 프리미엄 아티클</h2>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '20px' }}>
                      {ARTICLES.map(art => (
                        <div key={art.id} className="mg-card" style={{ display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                          <div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                              <span className="badge badge-gold">{art.category}</span>
                              <span style={{ fontSize: '12px', color: 'var(--muted)' }}>{art.readTime}</span>
                            </div>
                            <h3 style={{ fontSize: '18px', margin: '8px 0', color: 'var(--ink)' }}>{art.title}</h3>
                            <p style={{ fontSize: '13px', color: 'var(--muted)', marginBottom: '20px' }}>{art.summary}</p>
                          </div>
                          <button className="btn-outline" onClick={() => setSelectedArticle(art)}>아티클 읽기 →</button>
                        </div>
                      ))}
                    </div>

                    {/* Article Modal */}
                    {selectedArticle && (
                      <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px' }}>
                        <div className="mg-card" style={{ maxWidth: '600px', width: '100%', maxHeight: '80vh', overflowY: 'auto' }}>
                          <span className="badge badge-gold" style={{ marginBottom: '8px' }}>{selectedArticle.category}</span>
                          <h2 className="font-serif" style={{ fontSize: '24px', margin: '8px 0 16px' }}>{selectedArticle.title}</h2>
                          <p style={{ fontSize: '14px', lineHeight: 1.8, color: 'var(--body)' }}>
                            {selectedArticle.summary} 통장 분리는 자산관리의 첫걸음입니다. 월급이 들어오는 즉시 소비 통장과 비상금 통장으로 구분해 이체하면 무의식적인 소비를 최소화할 수 있습니다.
                          </p>
                          <button className="btn-primary" style={{ marginTop: '24px', width: '100%' }} onClick={() => setSelectedArticle(null)}>닫기</button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}


          </main>

          {/* FOOTER */}
          <footer className="app-footer no-print">
            <div className="container footer-inner">
              <div>
                <div style={{ fontWeight: 700, color: 'var(--bottle)', fontSize: '18px' }}>머니그로우 (MoneyGrow)</div>
                <div style={{ fontSize: '13px', color: 'var(--muted)', marginTop: '4px' }}>밀레니얼 여성을 위한 성향 기반 온라인 재무관리 서비스 · 운영사: 어피티</div>
                <div style={{ fontSize: '12px', color: 'var(--muted)', marginTop: '6px' }}>© 2026 UPPITY MoneyGrow. All rights reserved.</div>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: '8px' }}>
                <span style={{ fontWeight: 600, fontSize: '13px', color: 'var(--ink)' }}>페이지 공유하기</span>
                <div className="a2a_kit a2a_kit_size_32 a2a_default_style">
                  <a className="a2a_dd" href="https://www.addtoany.com/share"></a>
                  <a className="a2a_button_telegram"></a>
                  <a className="a2a_button_linkedin"></a>
                  <a className="a2a_button_x"></a>
                  <a className="a2a_button_kakao"></a>
                  <a className="a2a_button_copy_link"></a>
                  <a className="a2a_button_threads"></a>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }


    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script defer src="https://static.addtoany.com/menu/page.js"></script>
</body>
</html>
