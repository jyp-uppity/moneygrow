    // ==========================================
    // SCORING LOGIC
    // ==========================================
    function calculateResult(answers) {
      let s = { pT: 0, pA: 0, rT: 0, rA: 0, imp: 0, avd: 0 };
      QUESTIONS.forEach(q => {
        const v = answers[q.id] || 3;
        const fv = q.isReverse ? (6 - v) : v;
        if (q.axis === 'planning') {
          q.subType === 'trait' ? (s.pT += fv) : (s.pA += fv);
        } else if (q.axis === 'risk') {
          q.subType === 'trait' ? (s.rT += fv) : (s.rA += fv);
        } else if (q.axis === 'impulsivity') {
          s.imp += fv;
        } else if (q.axis === 'avoidance') {
          s.avd += fv;
        }
      });
      const pTrait = Math.round(((s.pT - 4) / 16) * 100);
      const pAction = Math.round(((s.pA - 3) / 12) * 100);
      const rTrait = Math.round(((s.rT - 4) / 16) * 100);
      const rAction = Math.round(((s.rA - 3) / 12) * 100);
      const impulsivity = Math.round(((s.imp - 3) / 12) * 100);
      const avoidance = Math.round(((s.avd - 3) / 12) * 100);
      const typeKey = `${pTrait >= 50 ? 'P' : 'S'}${rTrait >= 50 ? 'G' : 'A'}`;
      const gap = Math.max(Math.abs(pTrait - pAction), Math.abs(rTrait - rAction));

      return {
        typeInfo: TYPES[typeKey],
        typeKey,
        scores: { pTrait, pAction, rTrait, rAction, impulsivity, avoidance },
        gap,
        gapText: gap >= 30 ? '크게 불일치 (주의)' : gap >= 15 ? '약간 불일치' : '상태 일치',
        gapColor: gap >= 30 ? 'var(--rust)' : gap >= 15 ? 'var(--gold)' : 'var(--teal)'
      };
    }

      ];

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const send = () => {
        if (!input.trim()) return;
        const userMsg = { from: 'user', text: input, time: '지금' };
        setMessages(prev => [...prev, userMsg]);

                          <div style={{ marginTop: 24, background: 'rgba(38,68,58,0.1)', padding: 20, borderRadius: 12, color: 'var(--bottle)' }}>
                            <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 6 }}>✓ 1:1 상담 예약이 완료됐습니다!</div>
                            <div style={{ fontSize: 14 }}>예약 일시: {bookingData.timeSlot}</div>
                            <div style={{ fontSize: 14, marginTop: 4 }}>Zoom 링크: <a href="#" onClick={e => e.preventDefault()} style={{ fontWeight: 700 }}>https://us06web.zoom.us/j/89230198421</a></div>
                            <div style={{ marginTop: 12 }}>
                              <button className="btn-outline" style={{ fontSize: 13 }} onClick={() => setBookingTab('chat')}>💬 채팅 상담 시작하기 →</button>
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}

                {bookingTab === 'chat' && (
                  <div>
                    <div className="mg-card" style={{ marginBottom: 20 }}>
                      <h3 style={{ fontSize: 18, marginBottom: 12 }}>💬 채팅 상담 — 상담사와 실시간으로 대화하세요</h3>
                      <p style={{ fontSize: 13, color: 'var(--muted)', marginBottom: 16 }}>
                        예약한 상담 시간에 맞춰 담당 코치와 텍스트 채팅으로 재무 고민을 나눌 수 있습니다.<br/>
                        채팅 기록은 다음 상담 때 참고 자료로 활용됩니다.
                      </p>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: 12 }}>
                        {COACHES.map(c => (
                          <div key={c.id} style={{ padding: 16, background: 'var(--paper)', borderRadius: 12, border: '1px solid var(--line)' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                              <div style={{ width: 36, height: 36, background: 'var(--bottle)', color: 'var(--gold-soft)', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700 }}>{c.avatar}</div>
                              <div>
                                <div style={{ fontWeight: 700, fontSize: 14 }}>{c.name}</div>
                                <div style={{ fontSize: 12, color: 'var(--muted)' }}>{c.title}</div>
                              </div>
                            </div>
                            <div style={{ fontSize: 12, color: 'var(--teal)', fontWeight: 700, marginBottom: 8 }}>🟢 채팅 가능: {c.available}</div>
                            <button className="btn-primary" style={{ width: '100%', fontSize: 13, padding: '8px 16px' }} onClick={() => setActiveChat(c)}>채팅 시작하기</button>
                          </div>
                        ))}
                      </div>
                    </div>

                    {activeChat && <ChatWindow coach={activeChat} onClose={() => setActiveChat(null)} />}
                  </div>
                )}
              </div>
            )}

            {/* TAB: ROUTINE */}
            {tab === 'routine' && (
              <div>
                <div style={{ background: 'var(--bottle-deep)', color: '#EDEFE4', padding: 36, borderRadius: 20, marginBottom: 32 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 16, marginBottom: 24 }}>
                    <div>
                      <span className="badge badge-gold" style={{ marginBottom: 10 }}>3단계 · 행동 지속 | 월 2,980원 구독 이용 중</span>
                      <h1 className="font-serif" style={{ fontSize: 32, margin: '6px 0 8px', color: '#F6F7EF' }}>김나영님의 재무루틴 관리실</h1>
                      <div style={{ fontSize: 14, color: 'rgba(237,239,228,0.75)' }}>담당 코치: 이지은 CFP · 목표: 비상금 1,000만 원 및 지출 자동화 시스템</div>
                    </div>
                    <div style={{ display: 'flex', gap: 14 }}>
                      <div style={{ background: 'rgba(255,255,255,0.08)', padding: '16px 20px', borderRadius: 14, textAlign: 'center', minWidth: 130 }}>
                        <div style={{ fontSize: 11, textTransform: 'uppercase', color: 'rgba(237,239,228,0.6)' }}>연속 실천 (STREAK)</div>
                        <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--gold-soft)', fontFamily: 'Fraunces, serif' }}>🔥 16일째</div>
                      </div>
                      <div style={{ background: 'rgba(255,255,255,0.08)', padding: '16px 20px', borderRadius: 14, textAlign: 'center', minWidth: 130 }}>
                        <div style={{ fontSize: 11, textTransform: 'uppercase', color: 'rgba(237,239,228,0.6)' }}>주간 미션 달성률</div>
                        <div style={{ fontSize: 24, fontWeight: 700, color: '#fff', fontFamily: 'Fraunces, serif' }}>{progressPct}%</div>
                      </div>
                    </div>
                  </div>
                  <div style={{ height: 8, background: 'rgba(255,255,255,0.15)', borderRadius: 4, overflow: 'hidden' }}>
                    <div style={{ width: `${progressPct}%`, height: '100%', background: 'linear-gradient(90deg, var(--gold-soft), var(--gold))', transition: 'width 0.3s' }}></div>
                  </div>
                </div>

                <div style={{ display: 'flex', gap: 12, borderBottom: '1px solid var(--line)', paddingBottom: 12, marginBottom: 28 }}>
                  {[['missions', '📝 주간 실천 미션'], ['qna', '💬 코치 1:1 Q&A'], ['articles', '📖 프리미엄 아티클'], ['chat', '🟢 채팅 상담']].map(([key, label]) => (
                    <button key={key} onClick={() => setRoutineTab(key)} className={`btn-outline ${routineTab === key ? 'btn-primary' : ''}`}>
                      {key === 'missions' ? `${label} (${completedCount}/${routines.length})` : key === 'qna' ? `${label} (${qnaList.length})` : label}
                    </button>
                  ))}
                </div>

                {routineTab === 'missions' && (
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                      <h2 className="font-serif" style={{ fontSize: 22 }}>이번 주 맞춤 실천 미션</h2>
                      <span style={{ fontSize: 13, color: 'var(--muted)' }}>클릭하여 완료 상태를 변경하세요</span>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                      {routines.map(r => (
                        <div key={r.id} className="mg-card" style={{ padding: '20px 24px', display: 'flex', justifyContentContent: 'space-between', alignItems: 'center', borderLeft: r.completed ? '5px solid var(--bottle)' : '1px solid var(--line)', background: r.completed ? 'rgba(38,68,58,0.02)' : '#fff' }}>
                          <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
                            <input type="checkbox" checked={r.completed}
                              onChange={() => setRoutines(routines.map(item => item.id === r.id ? { ...item, completed: !item.completed } : item))}
                              style={{ width: 20, height: 20, marginTop: 4, cursor: 'pointer' }} />
                            <div>
                              <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 4 }}>
                                <span className="badge badge-gold">{r.category}</span>
                                <span style={{ fontSize: 12, color: 'var(--muted)' }}>{r.day}</span>
                              </div>
                              <div style={{ fontWeight: 700, fontSize: 17, color: 'var(--ink)', textDecoration: r.completed ? 'line-through' : 'none' }}>{r.title}</div>
                              <div style={{ fontSize: 13, color: 'var(--muted)', marginTop: 4 }}>{r.desc}</div>
                            </div>
                          </div>
                          <button className={r.completed ? 'btn-primary' : 'btn-outline'} style={{ padding: '8px 18px', fontSize: 13, whiteSpace: 'nowrap' }}
                            onClick={() => setRoutines(routines.map(item => item.id === r.id ? { ...item, completed: !item.completed } : item))}>
                            {r.completed ? '✓ 수행 완료' : '진행 중'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {routineTab === 'qna' && (
                  <div>
                    <div className="mg-card" style={{ marginBottom: 28 }}>
                      <h3 style={{ fontSize: 18, marginBottom: 12 }}>담당 코치에게 질문하기</h3>
                      <p style={{ fontSize: 13, color: 'var(--muted)', marginBottom: 16 }}>주 1회 질문이 가능하며, 48시간 이내에 1:1 피드백 답변이 도착합니다.</p>
                      <textarea rows={3} placeholder="이번 주 미션을 수행하면서 어려웠던 점이나 금융 질문을 남겨주세요."
                        value={userQuestion} onChange={e => setUserQuestion(e.target.value)}
                        style={{ width: '100%', padding: '12px', borderRadius: '10px', border: '1px solid var(--line)', marginBottom: 14 }} />
                      <button className="btn-primary" onClick={() => {
                        if (!userQuestion.trim()) return;
                        setQnaList([...qnaList, { id: Date.now(), date: new Date().toISOString().split('T')[0], q: userQuestion, a: '답변을 작성하고 있습니다. 약 24~48시간 이내 업데이트됩니다.', coach: '이지은 CFP' }]);
                        setUserQuestion('');
                      }}>질문 제출하기</button>
                    </div>
                    <h3 style={{ fontSize: 18, marginBottom: 16 }}>Q&A 답변 내역</h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                      {qnaList.map(item => (
                        <div key={item.id} className="mg-card">
                          <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 6 }}>질문일: {item.date}</div>
                          <div style={{ fontWeight: 700, fontSize: 16, color: 'var(--ink)', marginBottom: 12 }}>Q. {item.q}</div>
                          <div style={{ background: 'var(--paper)', padding: 16, borderRadius: 10, borderLeft: '3px solid var(--bottle)' }}>
                            <div style={{ fontWeight: 700, fontSize: 13, color: 'var(--bottle)', marginBottom: 4 }}>💬 {item.coach} 답변</div>
                            <div style={{ fontSize: 14, color: 'var(--body)' }}>{item.a}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {routineTab === 'articles' && (
                  <div>
                    <h2 className="font-serif" style={{ fontSize: 22, marginBottom: 20 }}>어피티 픽 프리미엄 아티클</h2>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 20 }}>
                      {ARTICLES.map(art => (
                        <div key={art.id} className="mg-card" style={{ display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                          <div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                              <span className="badge badge-gold">{art.category}</span>
                              <span style={{ fontSize: 12, color: 'var(--muted)' }}>{art.readTime}</span>
                            </div>
                            <h3 style={{ fontSize: 18, margin: '8px 0', color: 'var(--ink)' }}>{art.title}</h3>
                            <p style={{ fontSize: 13, color: 'var(--muted)', marginBottom: 20 }}>{art.summary}</p>
                          </div>
                          <button className="btn-outline" onClick={() => setSelectedArticle(art)}>아티클 읽기 →</button>
                        </div>
                      ))}
                    </div>
                    {selectedArticle && (
                      <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 20 }}>
                        <div className="mg-card" style={{ maxWidth: 600, width: '100%', maxHeight: '80vh', overflowY: 'auto' }}>
                          <span className="badge badge-gold" style={{ marginBottom: 8 }}>{selectedArticle.category}</span>
                          <h2 className="font-serif" style={{ fontSize: 24, margin: '8px 0 16px' }}>{selectedArticle.title}</h2>
                          <p style={{ fontSize: 14, lineHeight: 1.8 }}>{selectedArticle.summary} 통장 분리는 자산관리의 첫걸음입니다.</p>
                          <button className="btn-primary" style={{ marginTop: 24, width: '100%' }} onClick={() => setSelectedArticle(null)}>닫기</button>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {routineTab === 'chat' && (
                  <div>
                    <div className="mg-card" style={{ marginBottom: 20 }}>
                      <h3 style={{ fontSize: 18, marginBottom: 8 }}>🟢 채팅 상담 — 정해진 시간에 코치와 대화하세요</h3>
                      <p style={{ fontSize: 13, color: 'var(--muted)', marginBottom: 16 }}>구독 회원은 담당 코치와 예약된 채팅 시간에 실시간으로 재무 질문을 할 수 있습니다.</p>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: 12, marginBottom: 16 }}>
                        {COACHES.map(c => (
                          <div key={c.id} style={{ padding: 16, background: 'var(--paper)', borderRadius: 12, border: '1px solid var(--line)' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                              <div style={{ width: 36, height: 36, background: 'var(--bottle)', color: 'var(--gold-soft)', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700 }}>{c.avatar}</div>
                              <div>
                                <div style={{ fontWeight: 700, fontSize: 14 }}>{c.name}</div>
                                <div style={{ fontSize: 12, color: 'var(--muted)' }}>{c.title}</div>
                              </div>
                            </div>
                            <div style={{ fontSize: 12, color: 'var(--teal)', fontWeight: 700, marginBottom: 8 }}>🟢 채팅 가능: {c.available}</div>
                            <button className="btn-primary" style={{ width: '100%', fontSize: 13, padding: '8px 16px' }} onClick={() => setActiveChat(c)}>채팅 시작하기</button>
                          </div>
                        ))}
                      </div>
                    </div>
                    {activeChat && <ChatWindow coach={activeChat} onClose={() => setActiveChat(null)} />}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="app-footer no-print">
            <div className="container footer-inner">
              <div>
                <div style={{ fontWeight: 700, color: 'var(--bottle)', fontSize: 18 }}>머니그로우 (MoneyGrow)</div>
                <div style={{ fontSize: 13, color: 'var(--muted)', marginTop: 4 }}>밀레니얼 여성을 위한 성향 기반 온라인 재무관리 서비스 · 운영사: 어피티</div>
                <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 6 }}>© 2026 UPPITY MoneyGrow. All rights reserved.</div>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 8 }}>
                <span style={{ fontWeight: 600, fontSize: 13, color: 'var(--ink)' }}>페이지 공유하기</span>
                <div className="a2a_kit a2a_kit_size_32 a2a_default_style">
                  <a className="a2a_dd" href="https://www.addtoany.com/share"></a>
                  <a className="a2a_button_telegram"></a>
                  <a className="a2a_button_linkedin"></a>
                  <a className="a2a_button_x"></a>
                  <a className="a2a_button_kakaotalk"></a>
                  <a className="a2a_button_copy_link"></a>
                  <a className="a2a_button_threads"></a>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    function pointerText() { return 'pointer'; }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script defer src="https://static.addtoany.com/menu/page.js"></script>
</body>
</html>
